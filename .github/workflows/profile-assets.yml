name: profile-assets

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check committed poster, icons, and chips
        run: python scripts/build_profile_assets.py --check
      - name: Check committed design drafts
        run: python scripts/build_designs.py --check
      - name: Rebuild the public language census from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile_assets.py --languages-smoke
