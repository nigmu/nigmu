<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Origin story</title>
  <desc id="desc">Two comic panels. By day, Nigam builds full stack apps, Android tools and machine learning models. By night, he plays the ukulele. Speech bubble: now working on TrackMySpend, resume-ledger and bg_download.</desc>
  <defs>
    <pattern id="bluedots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.4" fill="#1d6fe0"/><circle cx="0" cy="0" r="2.4" fill="#1d6fe0"/><circle cx="11" cy="0" r="2.4" fill="#1d6fe0"/><circle cx="0" cy="11" r="2.4" fill="#1d6fe0"/><circle cx="11" cy="11" r="2.4" fill="#1d6fe0"/></pattern>
    <pattern id="pinkdots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.4" fill="#ff3d9a"/><circle cx="0" cy="0" r="2.4" fill="#ff3d9a"/><circle cx="11" cy="0" r="2.4" fill="#ff3d9a"/><circle cx="0" cy="11" r="2.4" fill="#ff3d9a"/><circle cx="11" cy="11" r="2.4" fill="#ff3d9a"/></pattern>
    <radialGradient id="fadeAg" cx="100%" cy="0%" r="90%"><stop offset="0.05" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient><mask id="fadeA"><rect width="100%" height="100%" fill="url(#fadeAg)"/></mask>
    <radialGradient id="fadeBg" cx="0%" cy="100%" r="90%"><stop offset="0.05" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient><mask id="fadeB"><rect width="100%" height="100%" fill="url(#fadeBg)"/></mask>
  </defs>
  <style>
    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="1200" height="340" fill="#fff8e7"/>
  <rect x="12" y="12" width="702" height="316" fill="#c7ecff"/>
  <rect x="12" y="12" width="702" height="316" fill="url(#bluedots)" mask="url(#fadeA)" opacity="0.6"/>
  <rect x="38" y="92" width="452" height="182" fill="#ffffff" stroke="#111111" stroke-width="4"/>
  <text x="58" y="124" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#111111">BY DAY, NIGAM BUILDS FULL STACK</text><text x="58" y="154" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#111111">APPS, ANDROID TOOLS AND</text><text x="58" y="184" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#111111">MACHINE LEARNING MODELS.</text><text x="58" y="244" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#111111">BY NIGHT, HE PLAYS THE UKULELE.</text>
  <g transform="translate(596 214) rotate(28) scale(0.86)">
    <rect x="-13" y="-170" width="26" height="150" rx="4" fill="#8b4a1c" stroke="#111111" stroke-width="4"/>
    <path d="M-20 -210 L20 -210 L16 -165 L-16 -165 Z" fill="#6b3410" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="18" r="40" fill="#ff8c1a" stroke="#111111" stroke-width="5"/>
    <circle cx="0" cy="70" r="52" fill="#ff8c1a" stroke="#111111" stroke-width="5"/>
    <rect x="-36" y="20" width="72" height="40" fill="#ff8c1a"/>
    <circle cx="0" cy="22" r="15" fill="#111111"/>
    <rect x="-20" y="80" width="40" height="9" rx="2" fill="#6b3410" stroke="#111111" stroke-width="3"/>
    <line x1="-6" y1="-150" x2="-6" y2="58" stroke="#f1e3c8" stroke-width="1.4"/><line x1="-2" y1="-150" x2="-2" y2="58" stroke="#f1e3c8" stroke-width="1.4"/><line x1="2" y1="-150" x2="2" y2="58" stroke="#f1e3c8" stroke-width="1.4"/><line x1="6" y1="-150" x2="6" y2="58" stroke="#f1e3c8" stroke-width="1.4"/>
  </g>
  <g class="bob" style="animation-delay:-0s"><g transform="translate(520 96)"><ellipse cx="0" cy="0" rx="11" ry="8" transform="rotate(-20)" fill="#ff3d9a" stroke="#111111" stroke-width="3"/><path d="M9 -2 V-42 L26 -34" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <g class="bob" style="animation-delay:-1.2s"><g transform="translate(668 70)"><ellipse cx="0" cy="0" rx="11" ry="8" transform="rotate(-20)" fill="#ffd60a" stroke="#111111" stroke-width="3"/><path d="M9 -2 V-42 L26 -34" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <rect x="12" y="12" width="334" height="38" fill="#ffd60a" stroke="#111111" stroke-width="4"/><text x="26" y="37.3" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#111111">MEANWHILE, ON GITHUB...</text>
  <rect x="12" y="12" width="702" height="316" fill="none" stroke="#111111" stroke-width="6"/>
  <rect x="732" y="12" width="456" height="316" fill="#ffd1e8"/>
  <rect x="732" y="12" width="456" height="316" fill="url(#pinkdots)" mask="url(#fadeB)" opacity="0.6"/>
  <path d="M770 52 H1150 Q1170 52 1170 72 V218 Q1170 238 1150 238 H900 L860 292 L866 238 H770 Q750 238 750 218 V72 Q750 52 770 52 Z" fill="#ffffff" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <text x="960" y="96" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#111111">NOW WORKING ON:</text>
  <text x="960" y="138" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="900" fill="#e63946">TRACKMYSPEND,</text>
  <text x="960" y="174" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="900" fill="#1d6fe0">RESUME-LEDGER</text>
  <text x="960" y="210" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="900" fill="#2bb673">&amp; BG_DOWNLOAD!</text>
  <rect x="1026" y="282" width="107" height="33" fill="#ffd60a" stroke="#111111" stroke-width="4"/><text x="1038" y="304.2" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#111111">— NIGAM</text>
  <rect x="732" y="12" width="456" height="316" fill="none" stroke="#111111" stroke-width="6"/>
