<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">CTV-4 Clean_TV</title>
  <desc id="desc">Mission card CTV-4 for Clean_TV: a calmer Android TV. Status nominal.</desc>
  <style>
    .sweep { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lamp { animation: lamp 3.2s ease-in-out infinite; }
    @keyframes lamp { 50% { opacity: 0.35; } }
    .bob { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="560" height="280" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="2"/>
  <rect width="10" height="280" fill="#7fd7ff"/>
  <text x="32" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="2" fill="#ffc857">CTV-4</text>
  <circle class="lamp" cx="430" cy="36" r="9" fill="#3ddc97"/><circle cx="428" cy="34" r="3" fill="#ffffff" opacity="0.65"/>
  <text x="448" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" letter-spacing="1" fill="#3ddc97">NOMINAL</text>
  <text x="32" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#e7f0ff">Clean_TV</text>
  <text x="32" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#8aa4c2">OBJECTIVE</text>
  <text x="32" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e7f0ff">a calmer Android TV</text>
  <g fill="#1e3a5f"><circle cx="36" cy="230" r="3"/><circle cx="52" cy="230" r="3"/><circle cx="68" cy="230" r="3"/><circle cx="84" cy="230" r="3"/></g>
  <text x="104" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8aa4c2">LINK LIVE</text>
</svg>
