<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522" role="img" aria-labelledby="title desc">
  <title id="title">Console</title>
  <desc id="desc">Toolbox as a switch console. Languages: Python, Kotlin, Java, JavaScript, HTML, CSS; Backend: FastAPI, Django, Flask, Node.js, PostgreSQL, MySQL; Data + Ml: Pandas, Seaborn, scikit-learn, TensorFlow, PyTorch, OpenCV; Apps + Ops: React, Android, Docker, Linux, Git.</desc>
