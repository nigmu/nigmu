<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-labelledby="title desc">
  <title id="title">LINKEDIN channel</title>
  <desc id="desc">Comm channel CH 3: LINKEDIN, nigamananda-behera.</desc>
  <style>
    .sweep { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lamp { animation: lamp 3.2s ease-in-out infinite; }
    @keyframes lamp { 50% { opacity: 0.35; } }
    .bob { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="360" height="110" rx="16" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="2"/>
  <circle class="lamp" cx="36" cy="55" r="9" fill="#3ddc97"/><circle cx="34" cy="53" r="3" fill="#ffffff" opacity="0.65"/>
  <text x="56" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#ffc857">CH 3</text>
  <text x="56" y="68" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#e7f0ff">LINKEDIN</text>
  <text x="56" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7fd7ff">nigamananda-behera</text>
</svg>
