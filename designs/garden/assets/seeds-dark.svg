  <title id="title">Seed packets</title>
  <desc id="desc">Toolbox as seed packets in trays. Languages: Python, Kotlin, Java, JavaScript, HTML, CSS; Backend: FastAPI, Django, Flask, Node.js, PostgreSQL, MySQL; Data + Ml: Pandas, Seaborn, scikit-learn, TensorFlow, PyTorch, OpenCV; Apps + Ops: React, Android, Docker, Linux, Git.</desc>
