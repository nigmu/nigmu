<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img" aria-labelledby="title desc">
  <title id="title">Patch bay</title>
  <desc id="desc">Toolbox drawn as an audio patch bay. Languages: Python, Kotlin, Java, JavaScript, HTML, CSS; Backend: FastAPI, Django, Flask, Node.js, PostgreSQL, MySQL; Data + Ml: Pandas, Seaborn, scikit-learn, TensorFlow, PyTorch, OpenCV; Apps + Ops: React, Android, Docker, Linux, Git.</desc>
  <style>
    .pulse { animation: pulse 7s linear infinite; }
    @keyframes pulse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1610; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
