<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="288" viewBox="0 0 1200 288" role="img" aria-labelledby="title desc">
  <title id="title">Station ID</title>
  <desc id="desc">A radio tuner dial sweeping between three channels: full-stack, Android and ML. A ticker reads: now playing TrackMySpend, resume-ledger, bg_download; fun fact: Nigam plays the ukulele.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0186f"/><stop offset="0.5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#008fb0"/>
    </linearGradient>
    <clipPath id="tickerclip"><rect x="220" y="200" width="936" height="56"/></clipPath>
    <filter id="soft" x="-200%" y="-10%" width="500%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .needle { animation: sweep 15s ease-in-out infinite; transform: translateX(299.1px); }
    @keyframes sweep {
      0%, 24% { transform: translateX(299.1px); }
      33%, 57% { transform: translateX(635.7px); }
      66%, 90% { transform: translateX(921.3px); }
      100% { transform: translateX(299.1px); }
    }
    .ticker { animation: ticker 23.7s linear infinite; }
    @keyframes ticker { to { transform: translateX(-1068px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
