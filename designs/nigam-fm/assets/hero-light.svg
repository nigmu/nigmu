  <title id="title">Nigam FM</title>
  <desc id="desc">Synthwave poster: a striped sunset over a neon grid, the name NIGAM in chrome lettering, and an ON AIR light. Full stack, Android and machine learning.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9d2"/><stop offset="0.55" stop-color="#ffd0e2"/><stop offset="0.7" stop-color="#e7cfff"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/><stop offset="0.45" stop-color="#ff9e2c"/><stop offset="0.8" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b1a82"/><stop offset="0.47" stop-color="#7b2ff7"/><stop offset="0.5" stop-color="#e0186f"/>
      <stop offset="0.53" stop-color="#ff4f8b"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <mask id="sunstripes">
      <rect width="1200" height="300" fill="white"/>
      <rect x="600" y="222" width="600" height="3" fill="black"/><rect x="600" y="237" width="600" height="5" fill="black"/><rect x="600" y="254" width="600" height="7" fill="black"/><rect x="600" y="273" width="600" height="9" fill="black"/><rect x="600" y="294" width="600" height="11" fill="black"/>
    </mask>
    <clipPath id="floorclip"><rect y="300" width="1200" height="140"/></clipPath>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <style>
    .lane { animation: lane 7s linear infinite; }
    @keyframes lane {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.45; }
      25% { transform: translateY(9px); }
      50% { transform: translateY(35px); }
      75% { transform: translateY(79px); }
      100% { transform: translateY(140px); opacity: 0.45; }
    }
    .onair { animation: onair 2.4s ease-in-out infinite; }
    @keyframes onair { 50% { opacity: 0.25; } }
    .twinkle { animation: twinkle 5s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: 0.1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
