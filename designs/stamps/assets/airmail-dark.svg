<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" role="img" aria-labelledby="title desc">
  <title id="title">Airmail</title>
  <desc id="desc">Toolbox as airmail stickers. Languages: Python, Kotlin, Java, JavaScript, HTML, CSS; Backend: FastAPI, Django, Flask, Node.js, PostgreSQL, MySQL; Data + Ml: Pandas, Seaborn, scikit-learn, TensorFlow, PyTorch, OpenCV; Apps + Ops: React, Android, Docker, Linux, Git.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="1200" height="554" fill="#2c241e"/>
  <text x="48" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#f6ead7">Airmail</text>
  <text x="200" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#cbb89a">the toolbox, labelled for abroad</text>
